<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEWDAY FILM — 웨딩영상</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ============================================
       HOME PAGE STYLES
       ============================================ */

    /* ── YouTube 풀 너비 (맨 위) ── */
    .yt-fullwidth {
      width: 100%;
      background: #0e0d0b;
    }

    /* 16:9 비율 */
    .yt-inner {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #0e0d0b;
      overflow: hidden;
    }

    .yt-inner iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .yt-inner iframe.loaded { opacity: 1; }

    /* 클릭 전 썸네일 오버레이 */
    .yt-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: pointer;
      background: #0e0d0b;
      transition: opacity 0.5s ease;
    }

    .yt-overlay.hide {
      opacity: 0;
      pointer-events: none;
    }

    .yt-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.82;
      transition: opacity 0.3s ease;
    }

    .yt-overlay:hover img { opacity: 0.7; }

    /* 재생 버튼 */
    .yt-play-btn {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 3;
      pointer-events: none;
    }

    .yt-play-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 1.5px solid var(--color-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(14,13,11,0.5);
      backdrop-filter: blur(6px);
      transition: transform 0.35s ease, background 0.35s ease;
    }

    .yt-overlay:hover .yt-play-circle {
      transform: scale(1.1);
      background: rgba(201,169,110,0.18);
    }

    .yt-play-circle svg {
      width: 26px;
      height: 26px;
      fill: var(--color-accent);
      margin-left: 4px;
    }

    .yt-play-label {
      font-size: 0.62rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--color-accent-light);
    }

    /* ── Hero Slideshow ── */
    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }
    .hero__slides { position: absolute; inset: 0; }
    .hero__slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
      background-size: cover;
      background-position: center;
    }
    .hero__slide.active { opacity: 1; }

    /* ── 히어로 이미지 교체 영역 ── */
    .hero__slide:nth-child(1) {
      background-image: url('https://images.squarespace-cdn.com/content/v1/66d6aea9d812b707c02b1715/1726220931554-ITOH489SD1LRK9T01PFB/KakaoTalk_20240913_184349402_03.jpg');
    }
    .hero__slide:nth-child(2) {
      background-image: url('https://images.squarespace-cdn.com/content/v1/66d6aea9d812b707c02b1715/37bd28ff-aea3-446d-87f0-ae52de014a6b/KakaoTalk_20240913_184349402_08.jpg');
    }
    .hero__slide:nth-child(3) {
      background-image: url('https://images.squarespace-cdn.com/content/v1/66d6aea9d812b707c02b1715/176cfb26-a37e-4bf4-ad52-2f710fb46afe/KakaoTalk_20240913_184349402_04.jpg');
    }
    .hero__slide:nth-child(4) {
      background-image: url('https://images.squarespace-cdn.com/content/v1/66d6aea9d812b707c02b1715/6667c4d2-85a9-4289-968d-69ca0c6bc3ab/KakaoTalk_20240913_184349402_05.jpg');
    }

    .hero__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(14,13,11,0.3) 0%,
        rgba(14,13,11,0.1) 40%,
        rgba(14,13,11,0.6) 100%
      );
      z-index: 1;
    }
    .hero__content {
      position: absolute;
      bottom: 80px;
      left: 60px;
      z-index: 2;
      animation: heroFadeUp 1.2s ease 0.3s both;
    }
    @keyframes heroFadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero__tagline {
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 6vw, 5rem);
      font-weight: 300;
      font-style: italic;
      line-height: 1.1;
      color: var(--color-text);
      margin-bottom: 16px;
    }
    .hero__tagline em {
      font-style: normal;
      color: var(--color-accent);
    }
    .hero__sub {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    .hero__dots {
      position: absolute;
      bottom: 40px;
      right: 60px;
      z-index: 2;
      display: flex;
      gap: 10px;
    }
    .hero__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-muted);
      cursor: pointer;
      transition: background var(--transition);
    }
    .hero__dot.active {
      background: var(--color-accent);
      transform: scale(1.3);
    }
    .hero__scroll {
      position: absolute;
      bottom: 40px;
      left: 60px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    .hero__scroll-line {
      width: 40px;
      height: 1px;
      background: var(--color-accent);
      animation: scrollLine 2s ease-in-out infinite;
    }
    @keyframes scrollLine {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(0.5); transform-origin: left; }
    }

    /* ── Intro 섹션 ── */
    .section-intro {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 120px 60px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }
    .section-intro__label {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 16px;
    }
    .section-intro__heading {
      font-family: var(--font-display);
      font-size: clamp(2rem, 3.5vw, 2.5rem);
      font-weight: 300;
      line-height: 1.2;
      margin-bottom: 24px;
    }
    .section-intro__text {
      font-size: 0.85rem;
      color: var(--color-muted);
      line-height: 1.9;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-accent-light);
      border-bottom: 1px solid var(--color-accent);
      padding-bottom: 4px;
      transition: color var(--transition), gap var(--transition);
    }
    .btn:hover {
      color: var(--color-accent);
      gap: 18px;
    }
    .section-intro__image {
      position: relative;
    }
    .section-intro__image img {
      width: 100%;
      object-fit: cover;
    }
    .section-intro__image::before {
      content: '';
      position: absolute;
      top: -20px;
      left: -20px;
      right: 20px;
      bottom: 20px;
      border: 1px solid var(--color-border);
      z-index: -1;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .hero__content  { left: 24px; bottom: 100px; }
      .hero__dots     { right: 24px; }
      .hero__scroll   { left: 24px; }

      .yt-play-circle { width: 60px; height: 60px; }
      .yt-play-circle svg { width: 20px; height: 20px; }

      .section-intro {
        grid-template-columns: 1fr;
        padding: 60px 24px;
        gap: 40px;
      }
      .section-intro__image::before { display: none; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <a href="index.html" class="nav__logo">NEWDAY FILM</a>
    <ul class="nav__links">

  <div class="nav__mobile" id="mobileMenu">
    <span class="nav__mobile-close" id="mobileClose">✕</span>
    <a href="about.html">About</a>
    <a href="portfolio.html">Portfolio</a>

    <a href="contact.html">Contact</a>
  </div>

  <div class="page-wrapper">

    <!-- ============================================
         유튜브 영상 — 맨 위 풀 너비
         수정: VIDEO_ID → 실제 유튜브 영상 ID로 교체
         예) https://youtu.be/ABC123xyz → ABC123xyz
         ============================================ -->
    <div class="yt-fullwidth">
      <div class="yt-inner" id="ytInner">

        <iframe
          id="ytFrame"
          src=""
          data-src="https://www.youtube.com/embed/watch?v=lonUXQgn7-M"
          title="NEWDAY FILM — Wedding Highlight"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>

        <div class="yt-overlay" id="ytOverlay">
          <img
            src="https://img.youtube.com/vi/VIDEO_ID/maxresdefault.jpg"
            alt="영상 썸네일"
            onerror="this.src='https://img.youtube.com/vi/VIDEO_ID/hqdefault.jpg'"
          />
          <div class="yt-play-btn">
            <div class="yt-play-circle">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <polygon points="5,3 19,12 5,21"/>
              </svg>
            </div>
            <span class="yt-play-label">Play</span>
          </div>
        </div>

      </div>
    </div>

    
    <!-- ============================================
         INTRO SECTION
         수정: 텍스트, 이미지 URL
         ============================================ 
    <section class="section-intro">
      <div class="section-intro__text-block">
        <p class="section-intro__label">Wedding Videography</p>
        <h2 class="section-intro__heading">모든 순간은<br>기억될 가치가 있습니다</h2>
        <p class="section-intro__text">
          사랑의 이야기 속에서 빛나는 디테일을 포착하고,<br>
          아름다운 순간을 영원한 기억으로 남겨드립니다.
        </p>
        <a href="portfolio.html" class="btn">포트폴리오 보기 →</a>
      </div>

      <div class="section-intro__image">
        <img
          src="https://i.pinimg.com/736x/ed/55/34/ed55345fee0c7b7b8f01b6ba8242af52.jpg"
          alt="Wedding film still"
          loading="lazy"
        />
      </div>
    </section> -->

    <!-- FOOTER -->
    <footer class="footer">
      <div>
        <div class="footer__brand">NEWDAY FILM</div>
        <div class="footer__copy">© 2024 Newday Film. All rights reserved.</div>
      </div>
    </footer>

  </div>

  <script>
    // ── YouTube 클릭 재생 ──
    const overlay = document.getElementById('ytOverlay');
    const frame   = document.getElementById('ytFrame');

    if (overlay && frame) {
      overlay.addEventListener('click', () => {
        const src = frame.dataset.src;
        frame.src = src.includes('autoplay') ? src : src + '&autoplay=1';
        frame.addEventListener('load', () => frame.classList.add('loaded'), { once: true });
        overlay.classList.add('hide');
      });
    }

    // ── Hero Slideshow ──
    const slides        = document.querySelectorAll('.hero__slide');
    const dotsContainer = document.getElementById('heroDots');
    let current = 0;

    slides.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'hero__dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', () => goTo(i));
      dotsContainer.appendChild(dot);
    });

    function goTo(n) {
      slides[current].classList.remove('active');
      dotsContainer.children[current].classList.remove('active');
      current = (n + slides.length) % slides.length;
      slides[current].classList.add('active');
      dotsContainer.children[current].classList.add('active');
    }

    setInterval(() => goTo(current + 1), 5000);

    // ── Mobile Menu ──
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('mobileMenu').classList.add('open');
    });
    document.getElementById('mobileClose').addEventListener('click', () => {
      document.getElementById('mobileMenu').classList.remove('open');
    });
  </script>
</body>
